<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Ibarra Insumos</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --teal: #1a4a44; --teal2: #2a6b62;
      --green: #16a34a; --red: #ef4444;
      --dark: #f5f2ec; --dark2: #ede9e0;
      --text: #1a2420; --muted: #4a6b65;
      --border: rgba(0,0,0,0.1);
    }
    body { font-family: 'Lato', sans-serif; background: #f0f4f8; color: var(--text); min-height: 100vh; }

    /* LOGIN */
    #loginScreen { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--teal); }
    .login-box { background: white; border-radius: 16px; padding: 2.5rem; width: 100%; max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    .login-logo { text-align: center; margin-bottom: 2rem; }
    .login-logo h1 { font-family: 'Montserrat', sans-serif; font-size: 1.4rem; font-weight: 700; color: var(--teal); }
    .login-logo p { font-size: 0.82rem; color: var(--muted); margin-top: 0.3rem; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-family: 'Montserrat', sans-serif; font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 0.4rem; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 0.75rem 1rem; border: 1px solid var(--border); border-radius: 8px; font-family: 'Lato', sans-serif; font-size: 0.9rem; outline: none; background: var(--dark); }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--teal); }
    .form-group textarea { resize: vertical; min-height: 80px; }
    .btn { width: 100%; padding: 0.85rem; border: none; border-radius: 8px; font-family: 'Montserrat', sans-serif; font-size: 0.82rem; font-weight: 700; cursor: pointer; transition: background 0.2s; }
    .btn-primary { background: var(--teal); color: white; }
    .btn-primary:hover { background: var(--teal2); }
    .btn-danger { background: var(--red); color: white; width: auto; padding: 0.45rem 0.9rem; font-size: 0.72rem; }
    .error-msg { color: var(--red); font-size: 0.82rem; text-align: center; margin-top: 0.75rem; display: none; }

    /* ADMIN PANEL */
    #adminPanel { display: none; }
    .admin-header { background: var(--teal); padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; }
    .admin-header h1 { font-family: 'Montserrat', sans-serif; font-size: 1rem; font-weight: 700; color: white; }
    .btn-logout { background: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.3); border-radius: 6px; padding: 0.45rem 1rem; font-family: 'Montserrat', sans-serif; font-size: 0.72rem; font-weight: 600; cursor: pointer; }
    .admin-body { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; display: grid; grid-template-columns: 380px 1fr; gap: 2rem; align-items: start; }

    /* FORM PANEL */
    .panel { background: white; border-radius: 12px; padding: 1.75rem; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
    .panel-title { font-family: 'Montserrat', sans-serif; font-size: 0.85rem; font-weight: 700; color: var(--teal); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 1.5rem; padding-bottom: 0.75rem; border-bottom: 2px solid var(--dark2); }

    /* IMAGE UPLOAD */
    .upload-area { border: 2px dashed var(--border); border-radius: 8px; padding: 1.5rem; text-align: center; cursor: pointer; transition: border-color 0.2s; margin-bottom: 1rem; }
    .upload-area:hover { border-color: var(--teal); }
    .upload-area p { font-size: 0.82rem; color: var(--muted); }
    .upload-area input { display: none; }
    #previewImg { max-width: 100%; max-height: 150px; border-radius: 8px; margin-top: 0.75rem; display: none; }
    .upload-progress { display: none; margin-top: 0.5rem; }
    .progress-bar { height: 6px; background: #e5e7eb; border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--teal); width: 0%; transition: width 0.3s; }

    /* PRODUCTS LIST */
    .products-list { display: flex; flex-direction: column; gap: 0.75rem; max-height: 600px; overflow-y: auto; }
    .product-item { display: flex; align-items: center; gap: 1rem; padding: 0.85rem 1rem; border: 1px solid var(--border); border-radius: 10px; background: var(--dark); }
    .product-item img { width: 52px; height: 52px; object-fit: contain; border-radius: 6px; background: white; padding: 4px; flex-shrink: 0; }
    .product-item-placeholder { width: 52px; height: 52px; border-radius: 6px; background: var(--dark2); display: flex; align-items: center; justify-content: center; font-size: 1.4rem; flex-shrink: 0; }
    .product-item-info { flex: 1; }
    .product-item-name { font-family: 'Montserrat', sans-serif; font-size: 0.82rem; font-weight: 700; color: var(--text); }
    .product-item-cat { font-size: 0.72rem; color: var(--muted); margin-top: 0.1rem; }
    .product-item-actions { display: flex; gap: 0.4rem; }
    .btn-edit { background: var(--teal); color: white; border: none; border-radius: 6px; padding: 0.4rem 0.75rem; font-size: 0.72rem; font-family: 'Montserrat', sans-serif; font-weight: 600; cursor: pointer; }

    /* TOAST */
    #toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--teal); color: white; padding: 0.75rem 1.5rem; border-radius: 8px; font-family: 'Montserrat', sans-serif; font-size: 0.82rem; font-weight: 600; z-index: 9999; opacity: 0; transition: all 0.3s; pointer-events: none; }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #toast.error { background: var(--red); }

    .loading { text-align: center; color: var(--muted); font-size: 0.84rem; padding: 2rem; }
    .empty { text-align: center; color: var(--muted); font-size: 0.84rem; padding: 2rem; }

    @media (max-width: 768px) { .admin-body { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<div id="toast"></div>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">
      <h1>🛡️ Ibarra Insumos</h1>
      <p>Panel de Administración</p>
    </div>
    <div class="form-group">
      <label>Contraseña</label>
      <input type="password" id="passwordInput" placeholder="Ingresá la contraseña" onkeydown="if(event.key==='Enter') login()" />
    </div>
    <button class="btn btn-primary" onclick="login()">Ingresar</button>
    <p class="error-msg" id="loginError">Contraseña incorrecta</p>
  </div>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel">
  <div class="admin-header">
    <h1>📦 Panel de Productos — Ibarra Insumos</h1>
    <button class="btn-logout" onclick="logout()">Cerrar sesión</button>
  </div>
  <div class="admin-body">

    <!-- FORMULARIO -->
    <div class="panel">
      <div class="panel-title" id="formTitle">Agregar Producto</div>

      <div class="form-group">
        <label>Foto del producto</label>
        <div class="upload-area" onclick="document.getElementById('fileInput').click()">
          <p>📷 Hacé clic para subir una foto</p>
          <p style="font-size:0.72rem; margin-top:0.3rem;">JPG, PNG, WEBP — máx 2MB</p>
          <img id="previewImg" src="" alt="Preview" />
          <input type="file" id="fileInput" accept="image/*" onchange="previewImage(this)" />
        </div>
        <div class="upload-progress" id="uploadProgress">
          <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
          <p style="font-size:0.72rem; color:var(--muted); margin-top:0.3rem;" id="uploadStatus">Subiendo...</p>
        </div>
      </div>

      <div class="form-group">
        <label>Nombre del producto</label>
        <input type="text" id="inputNombre" placeholder="Ej: Lavandina Concentrada x 5 lts." />
      </div>

      <div class="form-group">
        <label>Descripción</label>
        <textarea id="inputDescripcion" placeholder="Describí las características principales del producto..."></textarea>
      </div>

      <div class="form-group">
        <label>Categoría</label>
        <select id="inputCategoria" onchange="updateSubcategorias()">
          <option value="">Seleccioná una categoría</option>
          <option value="Dispensers">Dispensers</option>
          <option value="Papeles">Papeles</option>
          <option value="Limpieza">Limpieza</option>
          <option value="Limpieza Institucional">Limpieza Institucional</option>
          <option value="Higiene">Higiene</option>
          <option value="Descartables">Descartables</option>
        </select>
      </div>

      <div class="form-group">
        <label>Subcategoría</label>
        <select id="inputSubcategoria">
          <option value="">Primero elegí una categoría</option>
        </select>
      </div>

      <input type="hidden" id="editingId" value="" />

      <button class="btn btn-primary" id="submitBtn" onclick="guardarProducto()">Agregar Producto</button>
      <button class="btn" id="cancelBtn" style="display:none; margin-top:0.5rem; background:var(--dark2); color:var(--text);" onclick="cancelarEdicion()">Cancelar</button>
    </div>

    <!-- LISTA DE PRODUCTOS -->
    <div class="panel">
      <div class="panel-title">Productos cargados <span id="productCount" style="font-weight:400; color:var(--muted);"></span></div>
      <div class="products-list" id="productsList">
        <div class="loading">Cargando productos...</div>
      </div>
    </div>

  </div>
</div>

<script>
  // ── CONFIG ──
  const SUPABASE_URL = 'https://khxtmxbdrcigddvskalk.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtoeHRteGJkcmNpZ2RkdnNrYWxrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzOTA0OTUsImV4cCI6MjA5NDk2NjQ5NX0.D82fR_OTye8Fbsk4xccfCr-J1FvqjO2Rnxjfsnsc_nQ';
  const ADMIN_PASSWORD = 'Choco2026ok';
  const BUCKET = 'productos';

  const SUBCATEGORIAS = {
    'Dispensers': ['Dispenser Toallas', 'Dispenser Jabón', 'Dispenser Papel', 'Dispenser Alcohol'],
    'Papeles': ['Toallas Intercaladas', 'Toallas en Bobina', 'Toallas en Rollo', 'Papel Higiénico'],
    'Limpieza': ['Lavandinas', 'Limpiadores Multiusos', 'Limpiavidrios', 'Desodorantes Ambientes', 'Alcoholes en Gel', 'Alcoholes al 70%', 'Baldes de Plástico', 'Blanqueadores para Ropa', 'Bolsas Camiseta', 'Cepillos de Mano', 'Escobas de Plástico', 'Esponjas y Fibras', 'Guantes Domésticos', 'Insecticidas', 'Jabones en Pan', 'Limpiabaños', 'Trapos de Piso'],
    'Limpieza Institucional': ['Toallas de Papel', 'Jabones Líquidos Dispenser', 'Papeles Higiénicos Inst.', 'Detergentes Profesionales', 'Desengrasantes Profesionales', 'Guantes Industriales', 'Señales Piso Mojado'],
    'Higiene': ['Higiene General'],
    'Descartables': ['Descartables General']
  };

  let uploadedImageUrl = '';

  // ── AUTH ──
  function login() {
    const pw = document.getElementById('passwordInput').value;
    if (pw === ADMIN_PASSWORD) {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('adminPanel').style.display = 'block';
      cargarProductos();
    } else {
      document.getElementById('loginError').style.display = 'block';
    }
  }

  function logout() {
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('adminPanel').style.display = 'none';
    document.getElementById('passwordInput').value = '';
  }

  // ── SUBCATEGORIAS ──
  function updateSubcategorias() {
    const cat = document.getElementById('inputCategoria').value;
    const sel = document.getElementById('inputSubcategoria');
    sel.innerHTML = '<option value="">Seleccioná una subcategoría</option>';
    if (cat && SUBCATEGORIAS[cat]) {
      SUBCATEGORIAS[cat].forEach(s => {
        const opt = document.createElement('option');
        opt.value = s; opt.textContent = s;
        sel.appendChild(opt);
      });
    }
  }

  // ── IMAGE PREVIEW & UPLOAD ──
  function previewImage(input) {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      const img = document.getElementById('previewImg');
      img.src = e.target.result;
      img.style.display = 'block';
    };
    reader.readAsDataURL(file);
  }

  async function uploadImage(file) {
    const ext = file.name.split('.').pop();
    const fileName = `producto_${Date.now()}.${ext}`;
    document.getElementById('uploadProgress').style.display = 'block';
    document.getElementById('progressFill').style.width = '30%';
    document.getElementById('uploadStatus').textContent = 'Subiendo imagen...';

    const formData = new FormData();
    formData.append('', file);

    const res = await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${fileName}`, {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'apikey': SUPABASE_KEY,
        'x-upsert': 'true'
      },
      body: formData
    });

    document.getElementById('progressFill').style.width = '100%';

    if (!res.ok) {
      const err = await res.text();
      console.error('Upload error:', err);
      document.getElementById('uploadStatus').textContent = '❌ Error al subir imagen';
      throw new Error('Upload failed: ' + err);
    }

    document.getElementById('uploadStatus').textContent = '✓ Imagen subida';
    return `${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${fileName}`;
  }

  // ── GUARDAR PRODUCTO ──
  async function guardarProducto() {
    const nombre = document.getElementById('inputNombre').value.trim();
    const descripcion = document.getElementById('inputDescripcion').value.trim();
    const categoria = document.getElementById('inputCategoria').value;
    const subcategoria = document.getElementById('inputSubcategoria').value;
    const editingId = document.getElementById('editingId').value;
    const fileInput = document.getElementById('fileInput');

    if (!nombre || !descripcion || !categoria || !subcategoria) {
      showToast('Completá todos los campos', true); return;
    }

    let imagen_url = uploadedImageUrl;

    if (fileInput.files[0]) {
      try { imagen_url = await uploadImage(fileInput.files[0]); }
      catch (e) { showToast('Error al subir la imagen', true); return; }
    }

    const data = { nombre, descripcion, categoria, subcategoria, imagen_url };
    const btn = document.getElementById('submitBtn');
    btn.textContent = 'Guardando...'; btn.disabled = true;

    let res;
    if (editingId) {
      res = await fetch(`${SUPABASE_URL}/rest/v1/productos?id=eq.${editingId}`, {
        method: 'PATCH',
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
        body: JSON.stringify(data)
      });
    } else {
      res = await fetch(`${SUPABASE_URL}/rest/v1/productos`, {
        method: 'POST',
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
        body: JSON.stringify(data)
      });
    }

    btn.textContent = editingId ? 'Guardar Cambios' : 'Agregar Producto';
    btn.disabled = false;

    if (res.ok) {
      showToast(editingId ? '✓ Producto actualizado' : '✓ Producto agregado');
      resetForm();
      cargarProductos();
    } else {
      showToast('Error al guardar el producto', true);
    }
  }

  // ── CARGAR PRODUCTOS ──
  async function cargarProductos() {
    const list = document.getElementById('productsList');
    list.innerHTML = '<div class="loading">Cargando...</div>';

    const res = await fetch(`${SUPABASE_URL}/rest/v1/productos?order=created_at.desc`, {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
    });

    const productos = await res.json();
    document.getElementById('productCount').textContent = `(${productos.length})`;

    if (!productos.length) {
      list.innerHTML = '<div class="empty">No hay productos cargados todavía.</div>'; return;
    }

    list.innerHTML = productos.map(p => `
      <div class="product-item">
        ${p.imagen_url ? `<img src="${p.imagen_url}" alt="${p.nombre}" />` : `<div class="product-item-placeholder">📦</div>`}
        <div class="product-item-info">
          <div class="product-item-name">${p.nombre}</div>
          <div class="product-item-cat">${p.categoria} › ${p.subcategoria}</div>
        </div>
        <div class="product-item-actions">
          <button class="btn-edit" onclick="editarProducto(${p.id})">✏️</button>
          <button class="btn btn-danger" onclick="eliminarProducto(${p.id})">🗑</button>
        </div>
      </div>
    `).join('');
  }

  // ── EDITAR ──
  async function editarProducto(id) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/productos?id=eq.${id}`, {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
    });
    const [p] = await res.json();

    document.getElementById('inputNombre').value = p.nombre;
    document.getElementById('inputDescripcion').value = p.descripcion;
    document.getElementById('inputCategoria').value = p.categoria;
    updateSubcategorias();
    document.getElementById('inputSubcategoria').value = p.subcategoria;
    document.getElementById('editingId').value = p.id;
    uploadedImageUrl = p.imagen_url;

    if (p.imagen_url) {
      const img = document.getElementById('previewImg');
      img.src = p.imagen_url; img.style.display = 'block';
    }

    document.getElementById('formTitle').textContent = 'Editar Producto';
    document.getElementById('submitBtn').textContent = 'Guardar Cambios';
    document.getElementById('cancelBtn').style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // ── ELIMINAR ──
  async function eliminarProducto(id) {
    if (!confirm('¿Seguro que querés eliminar este producto?')) return;
    const res = await fetch(`${SUPABASE_URL}/rest/v1/productos?id=eq.${id}`, {
      method: 'DELETE',
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
    });
    if (res.ok) { showToast('✓ Producto eliminado'); cargarProductos(); }
    else showToast('Error al eliminar', true);
  }

  // ── RESET ──
  function resetForm() {
    document.getElementById('inputNombre').value = '';
    document.getElementById('inputDescripcion').value = '';
    document.getElementById('inputCategoria').value = '';
    document.getElementById('inputSubcategoria').innerHTML = '<option value="">Primero elegí una categoría</option>';
    document.getElementById('editingId').value = '';
    document.getElementById('fileInput').value = '';
    document.getElementById('previewImg').style.display = 'none';
    document.getElementById('uploadProgress').style.display = 'none';
    document.getElementById('progressFill').style.width = '0%';
    document.getElementById('formTitle').textContent = 'Agregar Producto';
    document.getElementById('submitBtn').textContent = 'Agregar Producto';
    document.getElementById('cancelBtn').style.display = 'none';
    uploadedImageUrl = '';
  }

  function cancelarEdicion() { resetForm(); }

  // ── TOAST ──
  function showToast(msg, error = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = error ? 'show error' : 'show';
    setTimeout(() => t.className = '', 3000);
  }
</script>
</body>
</html>
